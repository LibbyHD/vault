<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex, nofollow" />
		<meta name="theme-color" content="#090c10" />
		<title>LibbyHD — FamilyOS Enterprise Dashboard</title>
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icon.svg" />
		<link rel="stylesheet" href="/app.css" />
	</head>
	<body>
		<a class="skip" href="#main">Skip to content</a>

		<!-- Executive SaaS Top Navigation -->
		<nav class="nav-global" aria-label="Global Navigation">
			<div class="nav-inner">
				<div class="brand-group">
					<a href="/" class="brand-logo">
						<span class="brand-icon">⚡</span>
						<span>LibbyHD</span>
					</a>
					<span class="brand-tag">FamilyOS</span>
				</div>

				<div class="switcher-wrap">
					<div class="switcher" id="person-switcher" role="group" aria-label="Select view">
						<button type="button" class="switch-btn" data-person="household" aria-pressed="true">👨‍👩‍👦‍👦 Both Boys</button>
						<button type="button" class="switch-btn side-left" data-person="callum" aria-pressed="false">Callum</button>
						<button type="button" class="switch-btn side-right" data-person="finnley" aria-pressed="false">Finnley</button>
					</div>
				</div>

				<div class="nav-actions">
					<div class="telemetry-status" title="Cloudflare SQLite Durable Objects Active">
						<span class="telemetry-dot"></span>
						<span>Live Edge</span>
					</div>
					<div class="user-menu">
						<span id="who-email" class="user-email-badge"></span>
						<button id="btn-signout" class="ghost btn-compact" title="Sign out">Log out</button>
					</div>
				</div>
			</div>
		</nav>

		<!-- Hero Banner -->
		<header class="hero-banner" id="top">
			<div class="hero-content">
				<div class="hero-title-group">
					<h1 id="child-name">FamilyOS</h1>
					<span class="badge side" id="child-label" hidden></span>
					<p class="hero-ages" id="ages"></p>
				</div>
				<div class="hero-freshness" id="fresh" aria-live="polite"></div>
			</div>
		</header>

		<!-- Executive KPI Grid (Real-time Clinical Metrics) -->
		<section class="kpi-grid" id="kpi-grid" aria-label="Key Clinical Metrics">
			<div class="kpi-card" id="kpi-age-card">
				<div class="kpi-label"><span>Ages & Gestation</span> <span>👶</span></div>
				<div class="kpi-value" id="kpi-age-val">Loading…</div>
				<div class="kpi-subtext" id="kpi-age-sub">Born 33w4d GA</div>
			</div>
			<div class="kpi-card" id="kpi-appt-card">
				<div class="kpi-label"><span>Next Clinical Visit</span> <span>🏥</span></div>
				<div class="kpi-value" id="kpi-appt-val">Checking…</div>
				<div class="kpi-subtext" id="kpi-appt-sub">Calendar & MyChart sync</div>
			</div>
			<div class="kpi-card" id="kpi-med-card">
				<div class="kpi-label"><span>Medications & Safety</span> <span>💊</span></div>
				<div class="kpi-value" id="kpi-med-val">Checking…</div>
				<div class="kpi-subtext" id="kpi-med-sub">Conflict check active</div>
			</div>
			<div class="kpi-card" id="kpi-issues-card">
				<div class="kpi-label"><span>Open Care Items</span> <span>📋</span></div>
				<div class="kpi-value" id="kpi-issues-val">Checking…</div>
				<div class="kpi-subtext" id="kpi-issues-sub">Action items tracked</div>
			</div>
		</section>

		<div id="alert" class="alert" role="alert" hidden></div>

		<!-- Executive Tab Navigation -->
		<nav class="tabs-bar" aria-label="Sections">
			<div class="tabs-inner tabs">
				<button class="tab-btn" data-tab="today" aria-current="page">Today</button>
				<button class="tab-btn" data-tab="issues">Issues</button>
				<button class="tab-btn" data-tab="record">Clinical Record</button>
				<button class="tab-btn" data-tab="letters">Story & Letters</button>
				<button class="tab-btn" data-tab="assistant">Libby AI</button>
				<button class="tab-btn" data-tab="sms">Phone & SMS</button>
				<button class="tab-btn" data-tab="sources">Vault & Sources</button>
			</div>
		</nav>

		<!-- Main Workspace Surface -->
		<main id="main" tabindex="-1">
			<section id="household" hidden></section>
			<section id="setup" hidden></section>
			<section data-panel="today"></section>
			<section data-panel="issues" hidden></section>
			<section data-panel="record" hidden></section>
			<section data-panel="letters" hidden></section>
			<section data-panel="assistant" hidden></section>
			<section data-panel="sms" hidden></section>
			<section data-panel="sources" hidden></section>
		</main>

		<!-- Modal Dialog -->
		<dialog id="sheet" aria-labelledby="sheet-title">
			<div class="sheet-head">
				<h2 id="sheet-title"></h2>
				<button class="ghost" id="sheet-close" aria-label="Close">✕</button>
			</div>
			<div id="sheet-body"></div>
		</dialog>

		<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
		<script src="https://accounts.google.com/gsi/client" async></script>
		<script src="/app.js" type="module"></script>
	</body>
</html>
